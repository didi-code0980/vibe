spring.application.name=skillmatrix
# Database config
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/skillmatrix?sslMode=VERIFY_IDENTITY&createDatabaseIfNotExist=true
spring.datasource.username=4JQL5iYWKpbZyGg.root
spring.datasource.password=8qe4rEGkxpBr3Fdp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate Envers
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.org.hibernate.envers.revision_field_name=REV
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVTYPE
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs

# Flyway — disabled: TiDB does not support CREATE TABLE...SELECT used by Flyway's schema history
# Schema changes are handled by spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# JWT
jwt.secret=skillmatrix-super-secret-key-minimum-32-chars-long
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# Avatar storage (Profile module)
app.storage.avatar-base-path=uploads/avatars
app.storage.avatar-public-base-url=/static/avatars
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB